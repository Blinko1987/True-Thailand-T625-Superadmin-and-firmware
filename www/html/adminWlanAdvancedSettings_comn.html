<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script type="text/javascript" src="../js/jquery.formFill.js"></script>
		<script type="text/javascript" src="../js/adminWlanAdvancedSettings_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title">2.4G无线高级配置--安全</p>
			<p class="main_header_hint">说明：本页配置无线LAN 口的安全特性。 包括设置认证方式、数据加密方式、无线网络认证密钥和密钥长度。</p>
		</div>
		<form id="wlanAdv_settings_form">
			<div class="main_item">
				<div class="main_item_name">选择SSID</div>
				<div class="main_item_content">
					<select id="wlsecurity_SSID">
					</select>
				</div>
			</div>
			<div class="main_item">
				<div class="main_item_name">网络认证方式</div>
				<div class="main_item_content">
					<select id="wlsecurity_NetworkWay" name="data.BeaconType">
						<option value='WPA2PSKWPA3SAE'>WPA2/WPA3 Mixed</option>
						<option value="WPAand11i">WPA/WPA2 Mixed</option>
						<option value="WPA">WPA</option>
						<option value="11i">WPA2</option>
						<option value="SharedKey">SHARED</option>
						<option value="Both">BOTH</option>
						<option value="None">None</option>
					</select>
				</div>
			</div>
			<div class="main_item">
				<div class="main_item_name">加密模式</div>
				<div class="main_item_content">
					<select id="wlsecurity_WPAEncryption" name="data.WPAEncryptionModes" class="WlanPwdMode-select">
						<option value="TKIPEncryption">TKIP</option>
						<option value="AESEncryption">AES</option>
						<option value="TKIPandAESEncryption">TKIP+AES</option>
						<option value="WEP">WEP</option>
					</select>
				</div>
			</div>
			<div class="main_item">
				<div class="main_item_name">WPA 预共享密钥</div>
				<div class="main_item_content">
					<div class="password_content password_content_wifi">
						<input type="password" maxlength="64" autocomplete="off"  name="data.PreSharedKey" id="wlsecurity_WPAkeys">
						<div class="password_switch password_switch_unfocus"></div>
					</div>
				</div>
			</div>
			<!-- <div class="main_item">
				<div class="main_item_name">WEP 加密</div>
				<div class="main_item_content">
					<select id="wlsecurity_WEPEncryption" name="data.WEPEncryption">
						<option value="0">禁用</option>
						<option value="share">启用</option>
					</select>
				</div>
			</div> -->
			<div id="wlsecurity_WEP">
				<div class="main_item">
					<div class="main_item_name">密钥长度</div>
					<div class="main_item_content">
						<select id="wlsecurity_Keylength" name="data.WEPEncryptionLevel">
							<option value="104-bit">128-bit</option>
							<option value="40-bit">64-bit</option>
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">当前网络密钥索引号</div>
					<div class="main_item_content">
						<select id="wlsecurity_KeyIndex" name="data.WEPKeyIndex">
							<option value="1">1</option>
							<option value="2">2</option>
							<option value="3">3</option>
							<option value="4">4</option>
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">网络密钥 1</div>
					<div class="main_item_content">
						<input type="text" name="data.WEPKey1" id="wlanWepKey1" class="input_text input_text_wifi">
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">网络密钥 2</div>
					<div class="main_item_content">
						<input type="text" name="data.WEPKey2" id="wlanWepKey2" class="input_text input_text_wifi">
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">网络密钥 3</div>
					<div class="main_item_content">
						<input type="text" name="data.WEPKey3" id="wlanWepKey3" class="input_text input_text_wifi">
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">网络密钥 4</div>
					<div class="main_item_content">
						<input type="text" name="data.WEPKey4" id="wlanWepKey4" class="input_text input_text_wifi">
					</div>
				</div>
				<span>
					128位密钥要求输入13个ASCII字符或26位十六进制数;<br/>
					64位密钥要求输入5个ASCII字符或10位十六进制数
				</span>
			</div>
			<div class="main_item">
				<div class="main_item_name" i18n="wpareauth"></div>
				<div class="main_item_content">
					<input type="text" maxlength="31" name="data.WPAReauthTime" id="WPAReauthTime_text" class="input_text input_text_wifi">(60s-86400s)
				</div>
			</div>
			<div class="main_save">
				<input type="button" onclick="saveApply()" value="保存" class="input_button">
			</div>
		</form>
		
	</body>
</html>
