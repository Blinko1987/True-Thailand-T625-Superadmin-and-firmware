<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
        <script language="javascript" src="../js/ddns_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="ddnsset"></p>
			<p class="main_header_hint" i18n="ddns_hint"></p>
		</div>
			<div id="add_div">
				<div class="main_content">
					<div class="main_item">
						<div class="main_item_name" i18n="networkconn"></div>
						<div class="main_item_content">
							<select id="DDNSWANInterface_select">
							</select>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="enableddns"></div>
						<div class="main_item_content">
							<input type="checkbox" id="DDNSCfgEnabled"/>&nbsp;
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="ddnsprovider"></div>
						<div class="main_item_content">
							<select id="DDNSProvider_select">
								<option value="noip">No-IP</option>
								<option value="dyndns">DynDNS</option>
							</select>
						</div>
					</div>
					<!--<div class="main_item">
						<div class="main_item_name" i18n="port"></div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" name="ServicePort_text" id="ServicePort_text"/>(1-65535)
						</div>
					</div>-->
					<div style="position:absolute; left:0px; top:0px; z-index:-1; width:0px; height:0px; border:0 none; opacity:0;">
						<input name="DDNSUsername_text" type="text" style="position:absolute; left:0px; top:0px; padding:0px; z-index:-10; width:0px; height:0px; border:0 none;"/>
						<input name="DDNSPassword_password" type="password" style="position:absolute; left:0px; top:0px; padding:0px; z-index:-10; width:0px; height:0px; border:0 none;"/>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="usernamename"></div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" name="DDNSUsername_text" id="DDNSUsername_text"/>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="password"></div>
						<div class="main_item_content">
							<input type="password" class="input_text" autocomplete="off" name="DDNSPassword_password" id="DDNSPassword_password"/>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="domain"></div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" name="DDNSDomainName_text" id="DDNSDomainName_text"/>
						</div>
					</div>
					<!--<div class="main_item">
						<div class="main_item_name" i18n="host"></div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" name="DDNSHostName_text" id="DDNSHostName_text"/>
						</div>
					</div>-->
				</div>
				<div class="main_save">
					<input type="button" class="input_button" onclick="doAdd()" i18n="add" i18n-set="value"/>
				</div>
			</div>
			
			<br /><br />
			<table class="tablelarge" style="margin:auto" cellspacing="0" cellpadding="3px" border="1px">
				<tr class="table-header">
					<th colspan="6" i18n="ddnslist"></th>
				</tr>
				<tr class="another-table-header">
					<td width="25%" i18n="networkconn"></td>
					<td width="20%" i18n="ddnsprovider"></td>
					<td width="15%" i18n="usernamename"></td>
					<td width="15%" i18n="domain"></td>
					<td width="15%" i18n="status"></td>
					<td width="10%" i18n="operate"></td>
				</tr>
				<tbody id="ddns_list">
				</tbody>
			</table>
	</body>
</html>
