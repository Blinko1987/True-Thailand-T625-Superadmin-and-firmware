<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
        <script language="javascript" src="../js/diag_voice_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="menu.voice"></p>
			<p class="main_header_hint" i18n="diagvoice_hint"></p>
		</div>
		<form id="diagvoice_form">
			<br/>
			<br/>
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name" i18n="enablelinetest"></div>
					<div class="main_item_content">
						<input  type='button' class="input_button" onClick='startPing(1)' i18n="linetest" i18n-set="value">
					</div>
				</div>
				<div id="resultDiv2" style='display: none'>
					<div class="main_item">
						<div class="main_item_name" i18n="externallinevoltage"></div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" id="voice_Voltage" name="voice_Voltage"/>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="ringresistance"></div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" id="voice_Resistance" name="voice_Resistance"/>
						</div>
					</div>
				</div>
				<div id='resultDiv1' style='display: none'>
					<pre  style="HEIGHT: 50px; width: 600px; font-size: 13px" readonly id="Ping_result_iframe">		
					</pre>
				</div>
				
				<div class="main_item">
					<div class="main_item_name" i18n="callnumber"></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="voice_number"/>
					</div>
				</div>
				<div class="main_save">
					<input  type='button' class="input_button" onClick='startPing(2)' id="voice_test" i18n="analogcalltest" i18n-set="value">
				</div>
				<br/><br/>
				<table id='resultDiv4' class="nobordertable" cellpadding="0" cellspacing="0" width='500px' height='280px' style='display: none'>
					<tr>
						<td width="150"><b i18n="analogcalltestresult"></b></td>
					</tr>		
					<tr><td id='voice_result1' i18n="portidle"></td></tr>
					<tr><td id='voice_result2' i18n="offhook"></td></tr>
					<tr><td id='voice_result3' i18n="playdialtone"></td></tr>
					<tr><td id='voice_result4' i18n="receivenumber"></td></tr>
					<tr><td id='voice_result5' i18n="receivenumberdone"></td></tr>
					<tr><td id='voice_result6' i18n="listenringbacktone"></td></tr>
					<tr><td id='voice_result7' i18n="callstatus"></td></tr>
					<tr><td id='voice_result8' i18n="testend"></td></tr>	
					<tr id='conclusion'>
						<td style="color:red;width:150px;" i18n="simulationresult"></td>
						<td id='voice_Conresult' style="color:red;"></td>
					</tr>			
					<tr id='failreason'>
						<td style="color:red;width:150px;" i18n="callersimulationfailreason"></td>
						<td id='voice_reason' style="color:red;"></td>
					</tr>			
				</table>
				<div id='resultDiv3' style='display: none'>
					<pre  style="HEIGHT: 50px; width: 600px; font-size: 13px" readonly id="Conclusion_result_iframe">
					</pre>
				</div>
				<div id='resultDiv5' style='display: none'>
					<p><span style="color:red;" i18n="voiceunregcannottest"></span></p>
				</div>	
			</div>
		</form>
	</body>
</html>
