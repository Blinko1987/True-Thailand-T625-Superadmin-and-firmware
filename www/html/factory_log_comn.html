<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script language="javascript" src="../js/factory_log_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="log.logset"></p>
			<p class="main_header_hint" i18n="log.hint"></p>
		</div>
		<form>
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name" i18n="log.voicesip"></div>
					<div class="main_item_content">
						<input type="radio" name="voicesip" id="voicesip_enable" disabled value="1"/><span i18n="enable"></span>&nbsp;&nbsp;
						<input type="radio" name="voicesip" id="voicesip_disable" disabled value="0"/><span i18n="disable"></span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="log.voiceh248"></div>
					<div class="main_item_content">
						<input type="radio" name="voiceh248" id="voiceh248_enable" disabled value="1"/><span i18n="enable"></span>&nbsp;&nbsp;
						<input type="radio" name="voiceh248" id="voiceh248_disable" disabled value="0"/><span i18n="disable"></span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="log.voicedriver"></div>
					<div class="main_item_content">
						<input type="radio" name="voicedriver" id="voicedriver_enable" disabled value="1"/><span i18n="enable"></span>&nbsp;&nbsp;
						<input type="radio" name="voicedriver" id="voicedriver_disable" disabled value="0"/><span i18n="disable"></span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="log.fhcfg"></div>
					<div class="main_item_content">
						<input type="radio" name="fhcfg" id="fhcfg_enable" disabled value="1"/><span i18n="enable"></span>&nbsp;&nbsp;
						<input type="radio" name="fhcfg" id="fhcfg_disable" disabled value="0"/><span i18n="disable"></span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="log.fhapi"></div>
					<div class="main_item_content">
						<input type="radio" name="fhapi" id="fhapi_enable" disabled value="1"/><span i18n="enable"></span>&nbsp;&nbsp;
						<input type="radio" name="fhapi" id="fhapi_disable" disabled value="0"/><span i18n="disable"></span>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
