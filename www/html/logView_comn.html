<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script type="text/javascript" src="../js/logView_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="showlog"></p>
			<p class="main_header_hint" i18n="logview_hint">
			</p>
		</div>
		<div class="main_item">
			<div class="main_item_name"><b i18n="logstate"></b></div>
			<div class="main_item_content">
				<span id="logSwitch"></span>
			</div>
		</div>
		<div class="main_save">
			<input type="button" class="input_button" onclick="showLog()" id="Restart_button" i18n="showlog" i18n-set="value">
			<input type="button" class="input_button" onclick="clearLog()" id="Restart_button" i18n="clearlog" i18n-set="value">
		</div>
		<table id="logtable" style="display:none"></table>
		<br/><br/>
	</body>
</html>
