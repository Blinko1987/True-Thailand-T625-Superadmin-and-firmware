<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script language="javascript" src="../js/main_ipfilter_v6_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="ipfilterset"></p>
			<p class="main_header_hint" i18n="ipfilter_hint"></p>
		</div>
		<form id="ipfilter_LAN_form">
		<div class="main_content">
				<div class="main_item">
					<div class="main_item_name" i18n="enableipfilter"></div>
					<div class="main_item_content">
						<input type="checkbox" id="enable_checkbox"/>&nbsp;&nbsp;&nbsp;&nbsp;<span style="align:right;color:red;" width=80 class="trad" i18n="hasinternetrouteconnen"></span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="filtermode"></div>
					<div class="main_item_content">
						<select id='mode_select'>
							<option value='black' i18n="blacklist"></option>
							<option value='white' i18n="whitelist"></option>
						</select>
						<span style="align:right;color:red;" width=80 class="trad" i18n="blackandwhitework"></span>
					</div>
				</div>
		</div>
		<div class="main_save_top_0">
				<input type="button" class="input_button" onclick="saveApply()" i18n="save" i18n-set="value"/>
		</div>
		</form>	
		<form id="ip_filter_list_form" style="display:none;">
		<div class="div_between_form"></div>
		<div id="add_div">
			<div class="main_header">
			<p class="main_header_title" i18n="addipfilter"></p>
			<p class="main_header_hint" i18n="addipfilter_hint"></p>
			</div>
			<div class="main_content">
					<div class="main_item">
						<div class="main_item_name" i18n="filtername"></div>
						<div class="main_item_content">
							<INPUT type="input"  class="input_text" maxLength="256" id="ipfilter_AddFilter" name="ipfilter_AddFilter"></input>
						</div>
						<div class='main_item_error_hint_extra' id="add_text_error"></div>
					</div>
				<!--	<div class="main_item">
						<div class="main_item_name">启用</div>
						<div class="main_item_content">
							<INPUT  type="checkbox" id="ipfilter_Enable"></input>
						</div>
					</div>
				-->
					<div class="main_item">
						<div class="main_item_name" i18n="iptype"></div>
						<div class="main_item_content">
							<select id="ipfilter_IPTYPE" disabled="disabled">
							  <option value="IPV6">IPv6</option>
							</select>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="protocol"></div>
						<div class="main_item_content">
							<select id="ipfilter_AddAgreement" >
							  <option value="TCP/UDP">TCP/UDP</option>
							  <option value="TCP">TCP</option>
							  <option value="UDP">UDP</option>
							  <option value="ICMPv6">ICMPv6</option>
							  <option value="ALL">ALL</option>
							</select>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="srcipmin"></div>
						<div class="main_item_content">
							<INPUT type="input"  class="input_text" maxLength="256" size="15" value="" id="ipfilter_MinSourceAddress"></input>
						</div>
						<div id="MinSourceAddress-error" class="main_item_error_hint_extra"></div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="srcipmax"></div>
						<div class="main_item_content">
							<INPUT type="input"  class="input_text" maxLength="256" size="15" value="" id="ipfilter_MaxSourceAddress"></input>
						</div>
						<div id="MaxSourceAddress-error" class="main_item_error_hint_extra"></div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="srcportmin"></div>
						<div class="main_item_content">
							<INPUT type="input" class="input_text" maxLength="256" size="15" value=""  id="ipfilter_MinSourcePort"></input>
						</div>
						<div id="MinSourcePort-error" class="main_item_error_hint_extra"></div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="srcportmax"></div>
						<div class="main_item_content">
							<INPUT type="input" class="input_text" maxLength="256" size="15" value="" id="ipfilter_MaxSourcePort"></input>
						</div>
						<div id="MaxSourcePort-error" class="main_item_error_hint_extra"></div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="destipmin"></div>
						<div class="main_item_content">
							<INPUT type="input"  class="input_text" maxLength="256" size="15" value="" id="ipfilter_MinDestinationAddress"></input>
						</div>
						<div id="MinDestinationAddress-error" class="main_item_error_hint_extra"></div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="destipmax"></div>
						<div class="main_item_content">
							<INPUT type="input"  class="input_text" maxLength="256" size="15" value="" id="ipfilter_MaxDestinationAddress"></input>
						</div>
						<div id="MaxDestinationAddress-error" class="main_item_error_hint_extra"></div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="destportmin"></div>
						<div class="main_item_content">
							<INPUT type="input"  class="input_text" maxLength="256" size="15" value=""  id="ipfilter_MinDestinationPort"></input>
						</div>
						<div id="MinDestinationPort-error" class="main_item_error_hint_extra"></div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="destportmax"></div>
						<div class="main_item_content">
							<INPUT type="input"  class="input_text" maxLength="256" size="15" value="" id="ipfilter_MaxDestinationPort"></input>
						</div>
						<div id="MaxDestinationPort-error" class="main_item_error_hint_extra"></div>
					</div>
			</div>
			<div class="main_save_top_0">
				<input type="button" class="input_button" onclick="doAdd()" i18n="add" i18n-set="value"/>
			</div>
		</div>
		<br /><br />
	<div id="Outflow_white">
		<table width="100%" style="margin:auto" cellspacing="0" cellpadding="3px" border="1px">
			<tr class="table-header">
				<th colspan="11" i18n="ipfilterlist"></th>
			</tr>
			<tr class="another-table-header" align="">
				<td width="70" align='center' i18n="filtername"></td>
				<td width="70" align='center' i18n="protocol"></td>
				<td width="70" align='center' i18n="srcipmin"></td>
				<td width="70" align='center' i18n="srcipmax"></td>
				<td width="70" align='center' i18n="destipmin"></td>
				<td width="70" align='center' i18n="destipmax"></td>		
				<td width="70" align='center' i18n="srcportmin"></td>
				<td width="70" align='center' i18n="srcportmax"></td>
				<td width="70" align='center' i18n="destportmin"></td>
				<td width="70" align='center' i18n="destportmax"></td>			
				<td width="70" align='center' i18n="delete"></td>
			</tr>
			<tbody id='Outflow_List'>
			</tbody> 
		</table>
	</div>
	</form>
	</body>
</html>
