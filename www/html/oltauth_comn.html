<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
        <script language="javascript" src="../js/oltauth_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="menu.gponsetting"></p>
			<p class="main_header_hint" i18n="oltauth_hint"></p>
			<p class="main_header_hint" id = "main_header_hint2" style="color:red; display:none;" i18n="oltauth_hint2"></p>
		</div>
		
			<div id="register_div22">
				<div class="main_content">
					<div style="position:absolute; left:0px; top:0px; z-index:-1; width:0px; height:0px; border:0 none; opacity:0;">
						<input name="loid" type="text" style="position:absolute; left:0px; top:0px; padding:0px; z-index:-10; width:0px; height:0px; border:0 none;"/>
						<input name="password" type="password" style="position:absolute; left:0px; top:0px; padding:0px; z-index:-10; width:0px; height:0px; border:0 none;"/>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="loidcode"></div>
						<div class="main_item_content">
							<input type="text" class="input_text" maxlength="24" autocomplete="off" name="loid" id="loid"/>
						</div>
					</div>
					<!--<div class="main_item">
						<div class="main_item_name">逻辑ID认证使用密码</div>
						<div class="main_item_content">
							<input type="checkbox" id="Loidpwd_checkbox" onclick="enableLoidPassword()"/>&nbsp;
						</div>
					</div>-->
					<div class="main_item">
						<div class="main_item_name" i18n="password"></div>
						<div class="main_item_content">
							<input type="password" class="input_text" autocomplete="off" name="password" id="password"/>&nbsp;&nbsp;&nbsp;&nbsp;<span style="align:right;color:red;" width=80 class="trad" i18n="nopwdleaveblank"></span>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name">GPON Serial Number</div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" id="gponsn_text" disabled />&nbsp;
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name">Device Serial Number</div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" id="dsn_text" disabled />&nbsp;
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name">TRUE Serial Number</div>
						<div class="main_item_content">
							<input type="text" class="input_text" autocomplete="off" id="truesn_text" disabled />&nbsp;
						</div>
					</div>
				</div>
				<div class="main_save">
					<input type="button" class="input_button" id="reg_button" i18n="save" i18n-set="value"/>
				</div>
			</div>
		
			<div id="progress_div22" style="display:none">
				<div class="progress_container"> 
					<div id="progress_bar" style="width:0%;"></div>  
				</div>
				<br/>
				<div id="progress_hint" i18n="registingolt"></div>&nbsp;&nbsp;&nbsp;&nbsp;<span style="align:left;color:#0056b3;" width=200 class="return_tologin" i18n="goback"></span>
			</div>
		
	</body>
</html>
