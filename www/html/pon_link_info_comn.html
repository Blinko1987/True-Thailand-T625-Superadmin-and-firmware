<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript" src="../js/util_comn.js"></script>
	<script type="text/javascript" src="../js/pon_link_info_comn.js"></script>
</head>
<body class='main_config_body'>
	<form>
	    <!-- <label><b i18n="ponlink_info_hint"></b></label> -->
		<br><br> 
		<!-- <label><b i18n="linkconninfo"></b></label>
		<br><br> -->
		<table class="tablesmall" cellspacing="0" cellpadding="3px" border="1px">
            <tbody>
				<tr class="table-header">
					<th colspan="2" i18n="linkconninfo"></th>
				</tr>
            	<tr class="oddtr">
	            <td class="table_title" width="50%" i18n="ponlinkconnstatus"></td>
	            <td width="50%" id='pon_status'></td>
	            </tr>
				<tr>
		            <td class="table_title" i18n="onustate"></td>
		            <td id='onustate'></td>
	            </tr>
	            <tr class="oddtr">
		            <td class="table_title" i18n="fec"></td>
		            <td id='fec_ability' i18n="support"></td>
	            </tr>
	            <tr>
		            <td class="table_title" i18n="fecstatus"></td>
		            <td id='fec_status'></td>
	            </tr>
           </tbody>
        </table>
		<br><br>
		<!-- <label><b i18n="Link_perf_stats"></b></label>
		<br><br> -->
		<table class="tablesmall" cellspacing="0" cellpadding="3px" border="1px">
            <tbody>
				<tr class="table-header">
					<th colspan="2" i18n="Link_perf_stats"></th>
				</tr>
            	<tr class="oddtr">
					<td class="table_title" width="50%" i18n="ponpacketsent"></td>
					<td width="50%" id="pon_send_pack"></td>
	            </tr>
	            <tr>
		            <td class="table_title" i18n="ponpacketreceive"></td>
		            <td id="pon_recv_pack"></td>
	            </tr>
	            <tr class="oddtr">
		            <td class="table_title" i18n="ponbytereceive"></td>
		            <td id="pon_recv_byte"></td>
	            </tr>
	            <tr>
		            <td class="table_title" i18n="ponbytesent"></td>
		            <td id="pon_send_byte"></td>
	            </tr>
	            <tr class="oddtr">
		            <td class="table_title" i18n="txpower"></td>
		            <td id="send_power"></td>
	            </tr>
	            <tr>
		            <td class="table_title" i18n="rxpower"></td>
		            <td id="recv_power"></td>
	            </tr>
	            <tr class="oddtr">
		            <td class="table_title" i18n="voltage"></td>
		            <td id="votage"></td>
	            </tr>
	            <tr>
		            <td class="table_title" i18n="biascurrent"></td>
		            <td id="current"></td>
	            </tr>
	            <tr class="oddtr">
		            <td class="table_title" i18n="temperature"></td>
		            <td id="tempreature"></td>
	            </tr>
				<tr>
		            <td class="table_title" i18n="catvrxpower"></td>
		            <td id="rxpowercatv"></td>
	            </tr>
				<tr class="oddtr">
		            <td class="table_title" i18n="catvtxpower"></td>
		            <td id="txpowercatv"></td>
	            </tr>
	        </tbody>
	    </table>
    </form>
		
</body>
</html>
