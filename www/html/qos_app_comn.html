<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script type="text/javascript" src="../js/qos_app_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="menu.qos_app"></p>
			<p class="main_header_hint" i18n="qosapp_hint"></p>
		</div>
		<form id="qos_form">
			<br />
			<table width="100%" cellspacing="0" cellpadding="3px" border="1px">
				<tr class="table-header">
					<th colspan="3" i18n="menu.qos_class"></th>
				</tr>
				<tr class="another-table-header">
					<th width="35%" i18n="servicename"></th>
					<th width="35%" i18n="classqueue"></th>
					<th width="30%" i18n="operate"></th>
				</tr>
				<tbody id="apps">
				</tbody>
			</table>
			<br />
			
			<div id="adddiv" style="display:none">
				<div class="main_content">
					<div class="main_item">
						<div class="main_item_name" i18n="servicename"></div>
						<div class="main_item_content">
							<select id="AppName" class="main_select">
								<option value="TR069">TR069</option> 
								<option value="VOIP">VOIP</option>
								<option value="iTV">iTV</option>
								<option value="INTERNET">INTERNET</option>
							</select>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name" i18n="classqueue"></div>
						<div class="main_item_content">
							<select id="ClassQueue" class="main_select">
								<!--<option value="1">Q1</option>
								<option value="2">Q2</option>
								<option value="3">Q3</option>
								<option value="4">Q4</option>
								<option value="5">Q5</option>
								<option value="6">Q6</option>
								<option value="7">Q7</option>
								<option value="8">Q8</option>-->
							</select>
						</div>
					</div>
				</div>
				<div class="main_save">
					<input type="button" class="input_button" onclick="addApp()" i18n="add" i18n-set="value"/>
				</div>
			</div>
		</form>
	</body>
</html>
