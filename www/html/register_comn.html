<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<title i18n="main.title"></title>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script language="javascript" src="../js/register_comn.js"></script>
	</head>
<body>
<div id="register_div">
<TABLE cellSpacing=0 cellPadding=0 width=808 align=center border=0 valign="middle">
	<TR>
		<TD><img height="137" src="../image/register_header_comn.gif" width="808"/></TD>
	</TR>
	<TR>
		<TD>
			<TABLE cellSpacing=0 cellPadding=0 width=808 align=center border=0 valign="middle">
				<TR>
					<TD width=77 background="../image/bg.gif" rowSpan=3></TD>
					<TD align=center width=653 height=323 background="../image/register_new_bg_t3.png">
						<TABLE cellSpacing=0 cellPadding=0 width=96% height=15% border=0>
							<TR><TD class="return_tologintd" align=right><FONT size=2 color=#000000 i18n="gobacklogin"></FONT></TD></TR>
						</TABLE>
						<TABLE cellSpacing=0 cellPadding=0 width=450 border=0 height=80%>
								<TR>
									<TD colSpan=2 height=13></TD>
								</TR>
								<TR name="Gansuinfo" id="Gansuinfo" style="display:none;">
									<TD colSpan=2 align=center style="font-size: 13px;"><FONT color=red i18n="adminusecommondonnot"></FONT></TD>
								</TR>
								<TR>
									<TD colSpan=2 height=8></TD>
								</TR>
								<TR>
									<TD colSpan=2 style="font-size: 13px;" i18n="servicereghint"></TD>
								</TR>
								<TR>
									<TD colSpan=2 style="font-size: 13px;" i18n="servicereghint1"></TD>
								</TR>
								<TR>
									<TD colSpan=2 style="font-size: 13px;" i18n="servicereghint2"></TD>
								</TR>
								<TR>
									<TD colSpan=2 style="font-size: 13px;" i18n="servicereghint3"></TD>
								</TR>
								<TR>
									<TD colSpan=2 style="font-size: 13px;" i18n="servicereghint4"></TD>
								</TR>
								<TR>
									<TD valign=bottom align=right width=130 height=25 id="loid_text"></TD>
									<TD valign=bottom align=left width=130><input type="text" id="loid" name="loid" size="24" maxlength="24">
									<span id=loid_hint style="color:red;"><span>
									</TD>
								</TR>
								<TR height=8>
									<TD colspan=2></TD>
								</TR>
								<TR>
									<TD valign=top align=right width=130 height=25 id="pass_text"></TD>
									<TD valign=top align=left width=130><input id="password" name="password" type="password" autocomplete="off" size=24 maxlength=12>
									<span id=password_hint style="color:red;" i18n="nopwdleaveblank"><span></TD>
								</TR>
								<TR>
									<TD align=middle colSpan=2 height=35>
										<input type="button" class="input_button2" id="reg_button" i18n="register" i18n-set="value"/>
										<input type="button" class="input_button" id="cancel_button" name="cancel" i18n="reset" i18n-set="value"/>
										<input type="button" class="input_button" id="restore_button" i18n="restorefactory" i18n-set="value"/>
									</TD>
								</TR>
								<TR>
									<TD align=center colSpan=2 width=100% height=20><font size=2 i18n="servicehotline"></TD>
								</TR>
								<TR>
									<TD align=left colSpan=2 height=50></TD>
								</TR>
						</TABLE>
					</TD>
					<TD width=78 background="../image/bg.gif" rowSpan=3></TD>
				</TR>
			</TABLE>
		</TD>
	</TR>
</TABLE>
</div>
<div id="progress_div" style="display:none">
	<TABLE cellSpacing=0 cellPadding=0 width=808 align=center border=0 valign="middle">
		<TR>
			<TD><img height="137" src="../image/register_header_comn.gif" width="808"/></TD>
		</TR>
		<TR>
			<TD>
				<TABLE cellSpacing=0 cellPadding=0 width=808 align=center border=0 valign="middle">
					<TR>
						<TD width=77 background="../image/bg.gif" rowSpan=3></TD>
						<TD align=center width=653 height=323 background="../image/register_new_bg_t3.png">
							<TABLE cellSpacing=0 cellPadding=0 width=96% height=15% border=0>
								<TR><TD class="return_tologintd" align=right><FONT size=2 color=#000000 i18n="gobacklogin"></FONT></TD></TR>
							</TABLE>
							<TABLE cellSpacing=0 cellPadding=0 width=400 border=0 height=80% align = center>
								<TR>
									<TD colSpan=2 height=32 id="note"></TD>
								</TR>
								<TR align>
									<TD colSpan=2>	
										<div class="progress_container"> 
											<div id="progress_bar" style="width:0%;"></div>  
										</div>
									</TD>
								</TR>
								<TR>
									<TD align=center colSpan=2 width=100% height=20 id="progress_hint" i18n="registingolt"></TD>
								</TR>
								<TR>
									<TD align=left colSpan=2 height=20></TD>
								</TR>
								<TR>
									<TD align=center colSpan=2 width=100% height=20><font size=2 i18n="servicehotline"></font></TD>
								</TR>
								<TR>
									<TD align=left colSpan=2 height=40></TD>
								</TR>
							</TABLE>
						</TD>
						<TD width=78 background="../image/bg.gif" rowSpan=3></TD>
					</TR>
				</TABLE>
			</TD>
		</TR>
	</TABLE>
</div>
</body>
</html>
