<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript" src="../js/util_comn.js"></script>
	<script type="text/javascript" src="../js/remoteaccess.js"></script>
	<script language='javascript'>
		$(document).ready(function(){
			//优化滚动条，无需改动
			customScrollBar("html");
		});
	</script>
</head>
<body class='main_config_body'>
	<div class="main_header">
		<p class="main_header_title" i18n="menu.remoteaccess"></p>
		<p class="main_header_hint" i18n="remoteaccess_hint"></p>
		<p class="main_header_hint" style="color:red;" i18n="remoteaccess_hint2"></p>
	</div>
	<div class="main_content">
		<div class="main_item">
			<div class="main_item_name" i18n="wanaclenable"></div>
			<div class="main_item_content">
				<input type="checkbox" id="wanaclenable_checkbox" onclick="controlenordisable()"/>&nbsp;
			</div>
		</div>
	</div>
	<br>
	<table width="100%" cellspacing="0" cellpadding="3px">
		<tr class="table-header">
			<th colspan="3" i18n="servicelist"></th>
		</tr>
		<tr class="another-table-header">
			<th width="20%" align="left" i18n="servicename"></td>
			<th width="20%" align="left" i18n="lanlan"></td>
			<!--<th width="20%" align="left" i18n="lanlanport"></td>-->
			<th width="20%" align="left" i18n="wanwan"></td>
			<!--<th width="20%" align="left" i18n="wanwanport"></td>-->
		</tr>
		<tr class="oddtr"><!-- telnet -->
			<td width="20%" i18n="telnet"></td>
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="TelnetLanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="TelnetLanPort"/></td>-->
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="TelnetWanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="TelnetWanPort"/></td>-->
		</tr>
		<tr class="eventr"><!-- ftp -->
			<td width="20%" i18n="ftp"></td>
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="FtpLanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="FtpLanPort"/></td>-->
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="FtpWanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="FtpWanPort"/></td>-->
		</tr>
		<tr class="oddtr"><!-- tftp -->
			<td width="20%" i18n="tftp"></td>
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="TftpLanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="TftpLanPort"/></td>-->
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="TftpWanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="TftpWanPort"/></td>-->
		</tr>
		<tr class="eventr"><!-- http -->
			<td width="20%" i18n="http"></td>
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="HttpLanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="HttpLanPort"/></td>-->
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="HttpWanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="HttpWanPort"/></td>-->
		</tr>
		<tr class="oddtr"><!-- https -->
			<td width="20%" i18n="https"></td>
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="HttpsLanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="HttpsLanPort"/></td>-->
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="HttpsWanEnable"/>&nbsp;</td>
			<!--<td width="20%"><input type="text" class="input_text2" autocomplete="off" id="HttpsWanPort"/></td>-->
		</tr>
		<tr class="eventr"><!-- ping -->
			<td width="20%" i18n="ping"></td>
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="PingLanEnable"/>&nbsp;</td>
			<!--<td width="20%"></td>-->
			<td width="20%"><input type="checkbox" style="margin-top:8px;" id="PingWanEnable"/>&nbsp;</td>
			<!--<td width="20%"></td>-->
		</tr>
	</table>
	<div class="main_save">
		<input type="button" class="input_button" id="apply" onclick="saveApply()" i18n="save" i18n-set="value">
	</div>
</body>
</html>
