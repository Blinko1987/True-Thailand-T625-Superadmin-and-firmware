<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script type="text/javascript" src="../js/traceroute_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="menu.traceroute"></p>
			<p class="main_header_hint" i18n="tracert_hint"></p>
		</div>
		<form id="traceroute_form">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name" i18n="networkconn"></div>
					<div class="main_item_content">
						<select id="wan_connect" class="main_select">
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="ipversion"></div>
					<div class="main_item_content">
						<select id="ip_version" class="main_select">
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="destaddr"></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="address" name="address"/>
					</div>
				</div>
			</div>
			<div class="main_save">
				<input type="button" class="input_button" onclick="saveApply()" i18n="menu.traceroute" i18n-set="value"/>
			</div>
			<br />
			<div id="result">
			</div>
		</form>
	</body>
</html>
