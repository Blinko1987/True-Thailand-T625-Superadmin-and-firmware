<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script type="text/javascript" src="../js/jquery.form.js"></script>
		<script type="text/javascript" src="../js/upgrade_preconfig_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title">预配置升级</p>
			<p class="main_header_hint">提示：您可以在本页面进行预配置升级，升级过程将持续3-4分钟。
			</p>
		</div>
		<form enctype="multipart/form-data" method="post" action="../cgi-bin/ajax?method=upload&action=upgradeimage" id="upgrade_form">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name">文件路径</div>
					<div class="main_item_content">
						<input type="file" id="upgradefile" name="upgradefile"/>&nbsp;
					</div>
				</div>
			</div>
			<div class="main_save">
				<input type="submit" class="input_button" id="upgrade_button" value="预配置升级">
			</div>
		</form>
	</body>
</html>
