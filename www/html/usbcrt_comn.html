<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script language="javascript" src="../js/usbcrt_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="menu.usbcrt_download"></p>
			<p class="main_header_hint" i18n="usbcrt_hint"></p>
		</div>
			<div class="main_content">
				<div class="main_item" >
					<div class="main_item_name" i18n="protocol"></div>
					<div class="main_item_content">
						<select id="protocal">
							<option value="http">HTTP</option>
							<option value="ftp">FTP</option>
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="serveraddrdomainorip"></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="ServerUrl_text" name="ServerUrl_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="port"></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="ServerPort_text" name="ServerPort_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="anonymouslogin"></div>
					<div class="main_item_content">
						<input type="checkbox" id="anonymity_checkbox" name="anonymity_checkbox"/>&nbsp;
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="usernamename"></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="user_text" name="user_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="password"></div>
					<div class="main_item_content">
						<input type="password" class="input_text" autocomplete="off" id="pwd_text" name="pwd_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="filedownloadpath"></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="downloadpath_text" name="downloadpath_text"/>
					</div>
				</div>
				<div class="main_item" >
					<div class="main_item_name" i18n="filesavepath"></div>
					<div class="main_item_content">
						<select id="SaveAsPath_text">
							<option id="SaveAsPath_button"></option>
						</select><label id='SaveAsPath_suffix'></label>
					</div>
				</div>
				<div class="main_item" >
					<div class="main_item_name" i18n="filedownloadstate"></div>
				</div>
				<div id="DownloadState_text"></div>
			</div>
			<div class="main_save">
				<input type="button" class="input_button" id="Btn_StartDownload_button" onclick="startdownload()" i18n="startdownload" i18n-set="value"/>&nbsp;&nbsp;
				<input type="button" class="input_button" id="Btn_RefreshDownload_button" onclick="refreshdownload()" i18n="refreshdownloadstate" i18n-set="value"/>&nbsp;&nbsp;
				<input type="button" class="input_button" id="Btn_CancelDownload_button" onclick="cancledownload()" i18n="canceldownload" i18n-set="value"/>
			</div>
	</body>
</html>
