<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script type="text/javascript" src="../js/jquery.formFill.js"></script>
		<script type="text/javascript" src="../js/wlanBandsteering_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="bandsteering"></p>
			<p class="main_header_hint" i18n="bandsteering_hint"></p>
		</div>
		
		<div class="main_item">
			<div class="main_item_name" i18n="bandsteering"></div>
			<div class="main_item_content">
				<input type="checkbox" id="BS_Enable_Chk"/>&nbsp;
			</div>
		</div>
		<div id="rssithreshold_div" style="display:none;">
			<div class="main_item">
				<div class="main_item_name" i18n="2gtransitionthreshold"></div>
				<div class="main_item_content">
					<select id="BS_threshold_1">
						<option value="-65">-65</option>
						<option value="-60">-60</option>
						<option value="-55">-55</option>
						<option value="-50">-50</option>
						<option value="-45">-45</option>
						<option value="-40">-40</option>
					</select>
				</div>
			</div>
			<div class="main_item">
				<div class="main_item_name" i18n="5gtransitionthreshold"></div>
				<div class="main_item_content">
					<select id="BS_threshold_5">
						<option value="-110">-110</option>
						<option value="-100">-100</option>
						<option value="-90">-90</option>
						<option value="-80">-80</option>
						<option value="-70">-70</option>
					</select>
				</div>
			</div>
		</div>
		
		<div class="main_save">
			<input type="button" class="input_button" id="apply" onclick="saveApply()" i18n="save" i18n-set="value">
		</div>
		
		<table class="tablemedium" id="status_tab" style="display:none;" cellspacing="0" cellpadding="3px" border="1px">
            <tbody>
				<tr class="table-header">
					<th colspan="5" i18n="status"></th>
				</tr>
            	<tr class="another-table-header">
					<th width="20%" i18n="band"></th>
					<th width="20%">SSID1</th>
					<th width="20%">SSID2</th>
					<th width="20%">SSID3</th>
					<th width="20%">SSID4</th>
				</tr>
			</tbody>
			<tbody>
				<tr class="oddtr">
					<td>2G</td>
					<td id="BS_active_1"></td>
					<td id="BS_active_2"></td>
					<td id="BS_active_3"></td>
					<td id="BS_active_4"></td>
				</tr>
				<tr>
					<td>5G</td>
					<td id="BS_active_5"></td>
					<td id="BS_active_6"></td>
					<td id="BS_active_7"></td>
					<td id="BS_active_8"></td>
				</tr>
			</tbody>
        </table>
		
	</body>
</html>
