<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language="javascript" src="../js/util_comn.js"></script>
		<script type="text/javascript" src="../js/jquery.formFill.js"></script>
		<script type="text/javascript" src="../js/wlanRepeater_comn.js"></script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title" i18n="menu.wifi_repeater"></p>
			<p class="main_header_hint" i18n="wlanrepeater_hint"></p> 
		</div>
			<div class="main_item">
				<div class="main_item_name" i18n="status"></div>
				<div class="main_item_content">
					<span id="repeaterstatus"></span>
					&nbsp;&nbsp;&nbsp;&nbsp;
					<input type="button" class="input_button" id="refresh" onclick="statusRefresh()" i18n="refresh" i18n-set="value">
				</div>
			</div>
			<div class="main_item">
				<div class="main_item_name" i18n="ssid"></div>
				<div class="main_item_content">
					<input type="text" maxlength="32" name="data.SSID" id="WlanSsid_text" class="input_text input_text_wifi">
				</div>
			</div>
			<div class="main_item">
				<div class="main_item_name" i18n="wifipwd"></div>
				<div class="main_item_content">
					<div class="password_content password_content_wifi">
						<input type="password" maxlength="32" autocomplete="off"  name="data.PreSharedKey" id="WlanPassword_password">
						<div class="password_switch password_switch_unfocus"></div>
					</div>
				</div>
			</div>
			<div class="main_save">
				<input type="button" class="input_button" id="apply" onclick="saveApply()" i18n="save" i18n-set="value">
			</div>
	</body>
</html>
